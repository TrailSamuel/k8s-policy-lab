apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-privileged-test
policies:
  - ../policies/disallow-privileged.yaml
resources:
  - good-pod.yaml
  - ../workloads/privileged-pod.yaml
results:
  - policy: disallow-privileged
    rule: privileged-containers
    resources:
      - good-pod
    kind: Pod
    result: pass
  - policy: disallow-privileged
    rule: privileged-containers
    resources:
      - privileged-pod
    kind: Pod
    result: fail
